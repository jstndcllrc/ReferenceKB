<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create new password - YourCompany Knowledge Base</title><link rel="stylesheet" href="/assets/login.css"></head><body><main class="card"><div class="brand"><img src="/yourcompany.png" alt="YourCompany logo"><div><h1>Knowledge Base</h1><p>Create a new password</p></div></div>{{ERROR}}<form method="post" action="/change-password"><input type="hidden" name="csrf" value="{{CSRF}}"><label for="password">New password</label><div class="password-row"><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="secondary password-toggle" data-target="password">View</button></div><label for="password_repeat">Repeat password</label><div class="password-row"><input id="password_repeat" name="password_repeat" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="secondary password-toggle" data-target="password_repeat">View</button></div><button>Create password</button></form></main><script>document.querySelectorAll('.password-toggle').forEach(button=>button.addEventListener('click',()=>{const input=document.getElementById(button.dataset.target),shown=input.type==='text';input.type=shown?'password':'text';button.textContent=shown?'View':'Hide'}));</script></body></html>
